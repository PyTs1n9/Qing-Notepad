# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build and Release

# Actions 运行记录的名称默认取提交信息，这里固定为「Qing Notepad v<版本>」，
# 与 Release 标题保持一致；手动触发（非 tag）时退化为 dev (<分支>)。
run-name: Qing Notepad ${{ github.ref_type == 'tag' && github.ref_name || format('dev ({0})', github.ref_name) }}

"on":
  push:
    tags:
      - 'v*'           # 推送 v1.0.0 这类 tag 时触发
  workflow_dispatch:    # 也支持手动触发

# 授予 GITHUB_TOKEN 写入权限，否则无法创建 Release
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"  # 修复 Node.js 20 弃用警告

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"              # 自动缓存 node_modules，加速 npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"   # 缓存 src-tauri/target/，加速 cargo build

      - name: 安装前端依赖
        run: npm ci

      # The tag is the source of truth for releases. Keep all Tauri/package
      # manifests aligned before tauri-action reads the bundle version.
      - name: 同步发布版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run version:set -- "${{ github.ref_name }}"

      # 构建、创建 Release、上传产物由 tauri-action 一步完成。
      # 这是每一版固定的发布路径：推送 v* tag → 构建 → 构建成功后直接发布 Release。
      # tagName 只在 v* tag 触发时非空：workflow_dispatch 时为空串，action 仅构建不发布，
      # 避免创建与分支同名的 tag（refs/tags/main 之类）。
      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: "${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}"
          VITE_SUPABASE_URL: "https://skwkzymlhqwgygwwlxoy.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_8TIwPzBdrHmYEwhnikfk5g_sVjODHwW"
          VITE_COLLAB_URL: "${{ vars.VITE_COLLAB_URL }}"
          # 签名私钥是唯一一条能让别人给全体用户推更新代码的凭证。丢了它，已安装的
          # 用户会永久停在旧版（旧 exe 里烧死了公钥，换 key 不会被接受），所以它必须
          # 同时存在于密码库与离线备份里，仓库里只有 secret。
          # 没有这两个 secret 时 `createUpdaterArtifacts` 会让 `tauri build` 直接失败，
          # 这是刻意留的硬失败：静默产出一个签不了名的包比构建失败更难查。
          TAURI_SIGNING_PRIVATE_KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
        with:
          tagName: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
          releaseName: 'Qing Notepad v__VERSION__'
          releaseBody: |
            ## 公告：

            - QQ 群：902898359
            - 问题反馈 QQ：3439329934
            - 0.8.1 及以后的版本可在软件内直接更新；0.8.0 及以前仍需手动安装一次。

            ## 本次更新 | ${{ github.ref_name }}

            本版主线有两条：本地编辑器改成「边写边看排版」的实时渲染，
            以及把笔记搬出主窗口——独立笔记窗口、资源管理器右键打开 `.md` 都在这一版。

            ### 新增｜实时渲染编辑

            - **边写边看**：`**粗体**`、`*斜体*`、`` `代码` ``、`[文本](链接)`、`~~删除线~~` 的标记在光标离开后就地隐藏，只留内容与样式；标题按 h1–h6 分级字号，引用带左侧竖线，代码块有底纹，分隔线与列表符号对齐。
            - **光标所在块回退源码**：正在编辑的那一段显示原始 Markdown，光标移开立刻恢复排版。想改标记本身，把光标放进去即可，不用切视图。
            - **11 条输入规则**：行首 `#` + 空格、`-` + 空格、`>`、`1. `、三个反引号、`$$`、`---`、任务勾选框等按键即生效，每条都能在设置里单独关掉，一次 `Ctrl+Z` 整条回退。
            - **表格**：以前完全没有渲染，现在按语法树逐格生成，单元格里可以继续写行内标记；光标进入表格时整块回退源码。
            - **代码块高亮**：接入 highlight.js 的 14 门语言，圆角卡片 + 四边发丝线，在代码块开头标注语言名即可。
            - **编辑器字体**：设置 → 基础 → 编辑器字体，不再固定 Consolas——中文没有等宽字体，这也是小字号发虚的根因。
            - **中文输入不再抖**：组字期间冻结装饰重算，候选框落下后一次性补算，拼音阶段不会跳动。
            - **视图只剩两档**：本地笔记改为「实时渲染 / 源码」，原来的「预览」与「分屏」已移除；云端编辑器的三档不变。

            ### 新增｜独立笔记窗口

            - 编辑器工具栏的窗口图标，或「文件 → 在独立窗口中打开」，把当前笔记放进单独窗口；同一篇笔记只开一个，重复点击切回已开的那个。
            - 独立窗口不是「简化版」：自绘头部（应用图标 + 标题 + 窗口按钮）、「文件 / 编辑 / 段落 / 格式 / 视图」菜单、正文、目录列和完整底栏（目录 / 源码 / 更新时间 / 保存状态 / 行词字字符）全部复用主窗口的实现。
            - 与主窗口双向同步保存；两边都有未保存的修改时各自先保留自己的内容，不弹窗打断。
            - 右上角「返回主软件」先保存，再回到主窗口并关掉独立窗口。

            ### 新增｜从资源管理器打开 .md

            - 安装版会把「Qing Notepad」写进 `.md` / `.markdown` 的右键「打开方式」（Windows 11 在「显示更多选项」里），**不会**改掉你原来的默认程序；重装或升级不需要先卸载，也不会留下重复项。
            - 外部文件先以草稿形式打开，标题旁标「外部文件 · 未入库」；编辑自动存草稿，直接关窗口也不会丢。
            - 点「返回主软件」才把它写进笔记库的「未分类笔记」；同一个文件重复打开仍指向同一篇，不会重复添加。
            - 文件本来就在笔记库里时，打开的是那篇笔记本身，不会复制一份。

            ### 改进｜窗口

            - 标题栏最顶部 8px 双击：宽度不变、高度铺满工作区；再次双击还原到铺满前的矩形。主窗口与独立笔记窗口都可用，标题栏其余区域双击仍是最大化/还原。
            - 磁贴窗改用只读的 Markdown 编辑器渲染，装饰与主编辑器同一套；可编辑的便签窗保存时直接写 Markdown，HTML 往返带来的多余空行一并消失。

            ### 修复

            - 外部文件入库前先确认笔记已落盘再删草稿：写盘失败时保留草稿并继续处理同批其它文件，不会出现「草稿删了、文件没写成」的不可恢复状态。
            - 代码块的光标行高亮不再盖住代码底纹（主题选择器权重问题）。

            ## 下载 | Download

            - `QingNotepad___VERSION___x64-setup.exe` - Windows NSIS 安装包，双击安装。

          releaseDraft: "false"
          prerelease: "false"
          # NSIS 工具链在 CI 上偶发下载失败（v0.7.0 build #34），整体重试 2 次
          retryAttempts: "2"
          # 自己生成清单而不是让 action 生成：需要 Gitee 那份（下载地址指向 Gitee，
          # 文件名也不同），action 只会产出指向 GitHub 的单份 latest.json。
          uploadUpdaterJson: "false"

      # 清单必须由构建产物导出的 .sig 生成 —— 签名与安装包字节绑定，
      # 本机构建出来的 .sig 签的不是 CI 发布出去的那个包。
      # 只在 tag 构建时生成：workflow_dispatch 没有 tag，拼出来的 URL 是残的。
      # `--notes-file UPDATE.md` 是顶栏更新卡片的正文来源：正文随清单分发，而不是烤进 exe，
      # 否则卡片只能显示「已经装上的那个版本」的说明，永远滞后一版。
      - name: 生成更新清单
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/updater-manifest.mjs --sig-dir src-tauri/target/release/bundle/nsis --tag "${{ github.ref_name }}" --notes-file UPDATE.md --out-dir .updater

      - name: 上传更新清单到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: "${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}"
        run: gh release upload "${{ github.ref_name }}" .updater/latest.json .updater/latest-gitee.json --clobber
