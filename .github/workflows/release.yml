# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build and Release

# Actions 运行记录的名称默认取提交信息，这里固定为「Qing Notepad v<版本>」，
# 与 Release 标题保持一致；手动触发（非 tag）时退化为 dev (<分支>)。
run-name: Qing Notepad ${{ github.ref_type == 'tag' && github.ref_name || format('dev ({0})', github.ref_name) }}

"on":
  push:
    tags:
      - 'v*'           # 推送 v1.0.0 这类 tag 时触发
  workflow_dispatch:    # 也支持手动触发

# 授予 GITHUB_TOKEN 写入权限，否则无法创建 Release
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"  # 修复 Node.js 20 弃用警告

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"              # 自动缓存 node_modules，加速 npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"   # 缓存 src-tauri/target/，加速 cargo build

      - name: 安装前端依赖
        run: npm ci

      # The tag is the source of truth for releases. Keep all Tauri/package
      # manifests aligned before tauri-action reads the bundle version.
      - name: 同步发布版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run version:set -- "${{ github.ref_name }}"

      # 构建、创建 Release、上传产物由 tauri-action 一步完成。
      # 这是每一版固定的发布路径：推送 v* tag → 构建 → 构建成功后直接发布 Release。
      # tagName 只在 v* tag 触发时非空：workflow_dispatch 时为空串，action 仅构建不发布，
      # 避免创建与分支同名的 tag（refs/tags/main 之类）。
      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: "${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}"
          VITE_SUPABASE_URL: "https://skwkzymlhqwgygwwlxoy.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_8TIwPzBdrHmYEwhnikfk5g_sVjODHwW"
          VITE_COLLAB_URL: "${{ vars.VITE_COLLAB_URL }}"
        with:
          tagName: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
          releaseName: 'Qing Notepad v__VERSION__'
          releaseBody: |
            ## 公告：

            - QQ 群：902898359
            - 问题反馈 QQ：3439329934
            - 如有严重 bug，将在 v0.8.x 中修复。

            ## 本次更新 | ${{ github.ref_name }}

            本版主线是把「插件」做成可安装、可授权、可回滚的扩展机制，同时新增知识图谱与通告栏；
            画布、扩展页与图谱浮层统一到工作台的卡片语言。

            ### 新增｜插件与扩展机制

            - **插件运行时（L1）**：插件命令不再跑在主线程，统一在 blob Worker 内执行。插件拿不到 `window`、`document` 与 `__TAURI_INTERNALS__`，唯一出口是 `postMessage` 回宿主。
            - **两阶段安装**：先解包并校验清单与权限，再由用户在权限弹窗里逐条确认，确认后才落盘；中途取消不会留下半装状态。
            - **多格式安装**：同时支持 `.qnp` 包与带 `package.json` 清单的目录形态；publisher 允许连字符，包装目录自动下钻，清单不合法时给出可读错误码而不是静默失败。
            - **权限闸门**：13 个权限码分属 `notes` / `todo` / `clipboard` / `editor` / `canvas` / `ai` 六组，每次调用先过权限表，未授予直接拒绝而非降级执行。
            - **命令面板**：`Ctrl+Shift+P` 打开，插件注册的命令与内置命令同列可搜。
            - **扩展页**：左栏「已安装 / 可用」两组，搜索覆盖名称、描述与作者；索引缺失、离线、全部已装、搜索无结果各有独立空态，不再一律显示「空」。
            - **回滚与卸载**：详情页可「回到 v{上一版本}」；卸载前明确说明「命令会从命令面板移除，已授予的权限一并收回」。
            - **错误日志**：详情页新增「错误日志」分区，取最近 100 条，读取失败可重试；失败原因另有常驻错误条显示在页头，不再只落在日志里。
            - **中央索引**：索引由作者仓库提供，GitHub 为主、Gitee 镜像兜底；单条坏数据会被跳过并做 schema 校验，不会拖垮整张索引；Rust 侧缓存 24 小时，进入扩展页不强制联网。
            - **编辑器 API（P1a）**：向插件开放 CodeMirror 6 的读取、写入与装饰能力：`getText(range?)`、`getSelection()`、`replace()`、`setDecorations()`，对应 `editor:read` / `editor:write` / `editor:decorate`。
            - **侧边栏视图（P1a-2）**：插件可注册自己的侧边栏视图，`setSelection` 与 `editor:selection` 已落地。
            - **扩展宿主（P1b，实验性）**：新增 `qing-plugin-rpc` 协议（Rust 桥 + 长轮询收件箱）、隐藏 `ext-host` webview、Worker 池与 `ProtocolTransport`。CSP 探针的结论是「协议可用，但只在重写形态下」，因此默认仍走内置 Worker 路径。
            - **崩溃恢复**：用 epoch 心跳探测宿主存活，连续 3 次失败自动回退内置模式，并给出 `E_HOST_RESTARTED` / `E_BUSY` 两个可读错误码（中英文案齐备）。
            - **示例插件**：随仓库提供 8 个可直接安装的示例——无头问候、字数统计（JS / TS 两版）、编辑器演示、大纲视图、片段库、笔记树、隔离探针；`examples/pack.mjs` 可一键打成 `.qnp`。
            - **画布写 API**：新增 `canvas:read` / `canvas:write` 与 `ai:summarize`，插件可按引用键读写画布节点、按需请求 AI 概括。

            ### 新增｜知识图谱

            - **资料库**：把任意文件夹添加为知识库，文件只读——不复制、不修改、不移位；移除资料库只解除引用，不动磁盘上的文件。
            - **图谱视图**：原生笔记与资料库文件同图渲染，支持按标签筛选、「只看孤立节点」、「只看断链」，以及按标题或路径搜索。
            - **断链处理**：`[[链接]]` 指向不存在的笔记时显示为断链节点；命中多篇同名笔记时提示「命中 N 篇同名笔记，请改写路径」。
            - **节点列表浮层**：可折叠的列表，支持键盘上下移动与回车选中（`role="listbox"` + `aria-activedescendant`），选中后播报「已选中《标题》，引用 N 篇」。
            - **详情与反链**：选中节点显示标题、路径与反链列表，可直接「在编辑器中打开」；本应用笔记支持就地预览，读不出的文件给出明确失败态。
            - **索引与缓存**：首次打开扫描一遍文件并建索引，之后走缓存；面板显示「上次扫描 时间」与节点数、边数。

            ### 新增｜画布

            - **笔记树结构图**：画布新增引用型节点 `ref`（笔记 / 文件夹 / 根），只读引用，双击打开源笔记；连线新增贝塞尔曲线样式；`hidden` 字段支持折叠。
            - **幂等同步**：插件按 `noteId` 幂等写回，已存在的节点只更新文本、不动用户摆好的位置；`listRefKeys` 用于对账，`cleanMissing` 显式清理源笔记已消失的节点。
            - **不做自动删除**：画布没有回收站，自动删除不可撤销，因此清理只由用户显式触发。
            - **规模降级**：笔记树插件在超过 150 个节点时只画文件夹骨架 + 每夹最多 12 篇 + 一个「还有 N 篇」占位节点，避免上百节点后拖拽发滞。
            - **工具栏**：改为居中悬浮胶囊，选择/平移分段、样式▾（填充与描边）、撤销/重做、缩放、浮动窗口、导出、保存态集中在一处；窄窗按容器宽度逐级收起文字标签，不出现瞬间消失。
            - **画布切换条**：右侧垂直悬浮条，静置 44px、展开 248px，支持新建、重命名、删除；选中态统一为强调色实心块。

            ### 新增｜更新日志与通告栏

            - **告示牌**：登录弹窗左侧新增通告栏，内容来自仓库内 `announcements.json`（Gitee raw 单源），同一份文件在构建期打进包做离线快照。
            - **三层降级**：远程拉取 4 秒超时，失败回落包内快照，再失败则不显示告示牌——不阻塞登录。
            - **版本区间**：每条通告可声明 `minAppVersion` / `maxAppVersionExclusive`，旧版本用户只会看到适用于自己的那几条。
            - **帮助菜单**：新增「更新日志」入口，可随时回看本版说明。

            ### 改进｜界面与交互

            - 扩展页、知识图谱浮层与画布工具栏统一到工作台概览的卡片语言：一层外框 + 发丝线分组，内部不再套多层边框。
            - 扩展页按工作台概览重排：页头改 19px 品牌字体标题 + 徽章，权限、命令、信息按内容卡分组，主次操作不再只靠颜色区分。
            - 知识图谱浮层的筛选项从原生复选框改成整行可点的开关；分组标题去掉大写与字距，中文不再出现字距错乱。
            - 图谱浮层的行高、空态与焦点顺序按对比度与可达性重排：空列表不再是 Tab 陷阱，「清除筛选」卸载后焦点有降落点。
            - 画布与图谱不再各自铺底色，统一露出壳层的磨砂与纸纹；悬空节点改为透明挖洞，不再是一个实心色点。
            - 新增 Toast 主机，安装、授权、导出等一次性结果有统一落点。
            - 顶栏、活动栏、侧栏与帮助菜单随扩展页、图谱页的加入重新排布；小青徽标改为固定品牌色，不随主题变化。
            - 剪贴板读写收进 Rust 侧命令，插件只能通过授权后的通道访问。

            ### 改进｜底层与工程质量

            - **原子写**：所有落盘改为「临时文件 + rename」；rename 失败时先备份再替换，中断不会留下半截文件。
            - **数据目录**：目录缺失时抛 `DATA_DIRECTORY_UNAVAILABLE`，不再悄悄重建一个空目录，把用户数据「变成空的」。
            - **架构门禁**：新增 `npm run verify:architecture`，把依赖单向、store 不碰宿主、落盘必须原子等 6 条契约变成可执行断言。
            - **验证脚本**：图谱 5 个（扫描 / 索引 / 同步 / 布局 / 标题）、插件 5 个（运行时 / 端到端 / 片段库 / 笔记树 / API 面）、原子写与 UI 对比度各 1 个，全部挂在 `npm run verify:*` 下。
            - **HTML → Markdown**：补上粘贴与导入路径的转换，保留列表、表格、代码块与链接。
            - **文档**：新增 `docs/INDEX.md` 一页导航、插件指南、扩展宿主与 VS Code 生态分析、团队协作规范、架构分层决策；知识图谱决策补上浮层扁平化与透明画布两节。

            ### 修复

            - **知识图谱节点点击无响应**：父层对渲染器的订阅没有把「渲染器是否已挂载」写进依赖，首次进入拿到空快照后静默丢订阅，点击永久无反应。已修，并补上本应用笔记预览与加载态。
            - **授权弹窗被选中态遮挡**：弹窗改挂到应用根节点，从任意视图触发安装都能看到。
            - **单条坏索引拖垮整张列表**：坏条目跳过并做 schema 校验，不再整表失效。
            - **片段库示例漏权限**：`qing.snippet` 升到 1.0.1，补上遗漏的 `notify` 权限。
            - **图谱浮层三层边框挤压内容**：256px 宽里三层框把内容挤成三个叠放的小部件，已改为单层外框 + 一条发丝线。
            - **扩展页错误只落在日志里**：新增常驻错误条，失败原因直接显示在详情页顶部。

            ### 注意

            - 插件机制本版仍属**实验性**：插件跑在 Worker 里，没有 Node 能力；扩展宿主（P1b）已实现但默认未启用，仍走内置 Worker 路径。
            - 扩展索引来自作者仓库，首次打开需要联网；离线时用 24 小时缓存，可能漏掉新扩展。
            - 知识库文件夹**只读**，应用不会修改或删除其中的文件；回收站内容不参与检索。
            - 画布与图谱改为透明底后，壁纸较复杂时节点标签的可读性会低于原来的不透明底——这是「半透明 + 小字 + 4.5:1 不可兼得」的已知取舍。
            - 通告栏只读 Gitee 单源；Gitee raw 不可达时退回包内快照，因此新通告可能要等下一次发版才可见。
            - 检索模型与推理运行时随安装包分发，安装包体积仍大于 0.6 之前的版本（NSIS 约 26 MB）。
            - 云端问答与润色需自备对应厂商 API Key；未配置时仍可使用本地「小青」。

            ## 下载 | Download

            - `QingNotepad___VERSION___x64-setup.exe` - Windows NSIS 安装包，双击安装。
          releaseDraft: "false"
          prerelease: "false"
          # NSIS 工具链在 CI 上偶发下载失败（v0.7.0 build #34），整体重试 2 次
          retryAttempts: "2"
          # 本项目未接入 tauri-plugin-updater，不需要 latest.json
          uploadUpdaterJson: "false"
