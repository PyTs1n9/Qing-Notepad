# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build and Release

# Actions 运行记录的名称默认取提交信息，这里固定为「Qing Notepad v<版本>」，
# 与 Release 标题保持一致；手动触发（非 tag）时退化为 dev (<分支>)。
run-name: Qing Notepad ${{ github.ref_type == 'tag' && github.ref_name || format('dev ({0})', github.ref_name) }}

"on":
  push:
    tags:
      - 'v*'           # 推送 v1.0.0 这类 tag 时触发
  workflow_dispatch:    # 也支持手动触发

# 授予 GITHUB_TOKEN 写入权限，否则无法创建 Release
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"  # 修复 Node.js 20 弃用警告

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"              # 自动缓存 node_modules，加速 npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"   # 缓存 src-tauri/target/，加速 cargo build

      - name: 安装前端依赖
        run: npm ci

      # The tag is the source of truth for releases. Keep all Tauri/package
      # manifests aligned before tauri-action reads the bundle version.
      - name: 同步发布版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run version:set -- "${{ github.ref_name }}"

      # 构建、创建 Release、上传产物由 tauri-action 一步完成。
      # 这是每一版固定的发布路径：推送 v* tag → 构建 → 构建成功后直接发布 Release。
      # tagName 只在 v* tag 触发时非空：workflow_dispatch 时为空串，action 仅构建不发布，
      # 避免创建与分支同名的 tag（refs/tags/main 之类）。
      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: "${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}"
          VITE_SUPABASE_URL: "https://skwkzymlhqwgygwwlxoy.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_8TIwPzBdrHmYEwhnikfk5g_sVjODHwW"
          VITE_COLLAB_URL: "${{ vars.VITE_COLLAB_URL }}"
        with:
          tagName: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
          releaseName: 'Qing Notepad v__VERSION__'
          releaseBody: |
            ## 公告：

            - QQ 群：902898359
            - 问题反馈 QQ：3439329934
            - 如有严重 bug，将在 v0.7.x 中修复。

            ## 本次更新 | ${{ github.ref_name }}

            ### 修复

            - **磨砂在安装包里完全不生效（v0.7.2 的回归）**：源样式同时写了 `backdrop-filter` 与 `-webkit-backdrop-filter`，构建时被判定为同值重复、只保留了带前缀那条，Chromium 于是把模糊整条忽略。开发模式（未压缩）一直正常，所以问题只在安装包里出现。本版已改为只写标准属性，模糊强度与饱和度恢复正常。
            - **磨砂滑块在没有背景图时看不出变化**：主卡不透明度此前固定在 92%，卡片背后只剩 8% 参与合成。现改为按侧栏不透明度派生（默认 60%），两个滑块恢复可见效果。
            - **系统关闭透明效果时无提示**：Windows 关闭「透明效果」会让系统忽略所有磨砂，此时六个滑块改为禁用，并在面板顶部说明原因。
            - **背景图状态不一致**：设置面板与主界面共用同一个「是否有背景图」判断，不再出现面板可调、界面不生效。
            - **AI 空会话问候语**：不再重复同一名称、不再显示接口的原始 URL，聚合平台的模型路径（如 `Pro/deepseek-ai/DeepSeek-V3`）只显示末尾名称。

            ### 改进

            - 全站正文对比度整改：拆分填充色与文字色（`accent-text`）、重定次级与弱化文字、按磨砂合成表面重新校验，正文与弱化文字在四个主题下均达到 4.5:1。
            - AI 会话按接口隔离：切换接口不再串会话，删除接口会一并提示将删除的会话数。
            - 顶栏、视图切换与文档动作重新整理，交互更清晰；统一弹窗与悬停浮层样式。

            ### 注意

            - 主卡默认比上一版更透（约 60%），这是磨砂可见的前提；底色不透明度越低，模糊越明显。
            - 模糊只作用于卡片背后的内容：没有背景图时背后是主题色晕，效果比有壁纸时弱属于预期。
            - 主卡较透时弱化文字会自动升级一档显示，层级由三档变为两档，对比度不受影响。
            - 检索模型与推理运行时随安装包分发，因此安装包比早期版本更大（NSIS 安装包约 26 MB）。
            - 云端问答与润色需自备对应厂商 API Key；未配置时仍可使用本地「小青」。
            - 本地「小青」完全离线，回收站内容不参与检索。

            ## 下载 | Download

            - `QingNotepad___VERSION___x64-setup.exe` - Windows NSIS 安装包，双击安装。
          releaseDraft: "false"
          prerelease: "false"
          # NSIS 工具链在 CI 上偶发下载失败（v0.7.0 build #34），整体重试 2 次
          retryAttempts: "2"
          # 本项目未接入 tauri-plugin-updater，不需要 latest.json
          uploadUpdaterJson: "false"
