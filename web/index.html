<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>碎片墙 · 想到就丢进来，回头再整理</title>
    <meta
      name="description"
      content="一屏便签墙：随手写下零碎念头，回车即存，一键整理成待办清单。数据只留在你自己的浏览器里，不上传服务器。"
    />
    <meta name="theme-color" content="#101114" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%232c4a57'/%3E%3Cpath d='M6.6 7h4.2c.9 0 1.3.5 1.3 1.2v9.4c-.4-.6-.9-.9-1.6-.9H6.6z' fill='%23faf4e6'/%3E%3Cpath d='M17.4 7h-4.2c-.9 0-1.3.5-1.3 1.2v9.4c.4-.6.9-.9 1.6-.9h3.9z' fill='%23e8dcc4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#wall">跳到碎片墙</a>

    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="7" fill="#2c4a57" />
          <path d="M6.6 7h4.2c.9 0 1.3.5 1.3 1.2v9.4c-.4-.6-.9-.9-1.6-.9H6.6z" fill="#faf4e6" />
          <path d="M17.4 7h-4.2c-.9 0-1.3.5-1.3 1.2v9.4c.4-.6.9-.9 1.6-.9h3.9z" fill="#e8dcc4" />
          <path d="M12 7.6v10" stroke="#16333f" stroke-width="1" stroke-linecap="round" />
        </svg>
        <div class="brand-copy">
          <span class="brand-name">碎片墙</span>
          <span class="brand-sub">青记 · 网页版</span>
        </div>
      </div>

      <div class="topbar-tools">
        <label class="search" for="search">
          <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="8.8" cy="8.8" r="5.4" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M12.9 12.9 17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <input
            id="search"
            type="search"
            placeholder="搜索碎片"
            autocomplete="off"
            spellcheck="false"
            aria-label="搜索碎片"
          />
          <kbd class="search-kbd">/</kbd>
        </label>

        <button id="tidy-button" class="button button-primary" type="button">
          一键整理
          <kbd>Ctrl ↵</kbd>
        </button>
      </div>
    </header>

    <main class="page">
      <section class="composer" aria-labelledby="composer-label">
        <label id="composer-label" class="visually-hidden" for="composer-input">记下一条碎片</label>
        <textarea
          id="composer-input"
          rows="1"
          placeholder="想到什么就先丢进来…"
          aria-describedby="composer-hint"
        ></textarea>
        <div class="composer-bar">
          <p id="composer-hint" class="composer-hint">
            回车存下 · Shift + 回车换行 · <code>#标签</code> 自动归类
          </p>
          <button id="composer-save" class="button button-quiet" type="button">存下</button>
        </div>
      </section>

      <section id="guide" class="guide" aria-label="三步上手" hidden>
        <ol class="guide-steps">
          <li><span class="guide-index">1</span>想到什么先丢进来，不用管格式</li>
          <li><span class="guide-index">2</span>顺手写个 <code>#标签</code>，比如 <code>#工作</code></li>
          <li><span class="guide-index">3</span>攒够了点「一键整理」，碎片变成清单</li>
        </ol>
        <button id="guide-close" class="guide-close" type="button" aria-label="关闭上手提示">知道了</button>
      </section>

      <section class="filters" aria-label="筛选与排序">
        <div class="tabs" role="tablist" aria-label="按状态筛选">
          <button class="tab is-active" type="button" role="tab" aria-selected="true" data-status="open">
            未处理
          </button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-status="all">全部</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-status="done">已完成</button>
        </div>

        <div id="tag-list" class="tag-list" aria-label="按标签筛选"></div>

        <div class="filters-tail">
          <span id="counter" class="counter">共 0 条</span>
          <label class="sort">
            <span class="visually-hidden">排序方式</span>
            <select id="sort">
              <option value="smart">置顶优先</option>
              <option value="new">最新在前</option>
              <option value="old">最早在前</option>
            </select>
          </label>
        </div>
      </section>

      <section id="wall" class="wall" aria-label="碎片墙"></section>

      <section id="empty" class="empty" hidden>
        <p class="empty-title">墙上还是空的</p>
        <p class="empty-copy">写下第一句，回车就存下来了。</p>
        <button id="empty-focus" class="button button-primary" type="button">开始写</button>
      </section>

      <footer class="page-foot">
        <p>
          碎片只保存在这台设备的浏览器里，不上传服务器；清理浏览器数据会一并清除。整理出的清单可以复制或导出为
          Markdown，直接粘进笔记里。
        </p>
      </footer>
    </main>

    <div id="scrim" class="scrim" hidden></div>

    <aside id="panel" class="panel" aria-labelledby="panel-title" aria-hidden="true">
      <header class="panel-head">
        <div>
          <h2 id="panel-title">整理结果</h2>
          <p id="panel-summary" class="panel-summary"></p>
        </div>
        <button id="panel-close" class="icon-button" type="button" aria-label="关闭整理结果">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </header>
      <div class="panel-body">
        <pre id="panel-markdown" class="markdown" tabindex="0"></pre>
      </div>
      <footer class="panel-foot">
        <button id="panel-copy" class="button button-primary" type="button">复制清单</button>
        <button id="panel-download" class="button" type="button">下载 .md</button>
        <button id="panel-clear" class="button button-quiet" type="button">清空已完成</button>
      </footer>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <noscript>
      <p class="noscript">碎片墙需要 JavaScript 才能运行：所有内容都存在你自己的浏览器里，不会有任何上传。</p>
    </noscript>

    <script type="module" src="./app.js"></script>
  </body>
</html>
