[package]
name = "qing-notepad"
version = "0.9.0"
description = "Qing Notepad - A lightweight note-taking app built with Tauri"
authors = ["PyTs1N9"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qing_notepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keep each plugin on the same minor as its @tauri-apps/plugin-* JS package:
# Tauri refuses to build on a JS/Rust minor mismatch.
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-http = "2.8.3"
# 软件内更新。只有 Rust 侧使用（没有对应的 `@tauri-apps/plugin-updater` 依赖），
# 因此不需要遵守上面那条 JS/Rust 同 minor 的约束。
#
# 关掉默认特性有明确理由：默认带 `rustls-tls`（会再塞一整套 rustls + ring，而
# `tauri-plugin-http` 走的是 native-tls/schannel）和 `zip`（Windows 的 NSIS 更新包是
# 一个 .exe，不需要解压，却会把 tar 一起拉进来）。这里只保留 native-tls 与系统代理，
# 装好的包体积才不会被更新功能白白撑大。
tauri-plugin-updater = { version = "2.9", default-features = false, features = ["native-tls", "system-proxy"] }
# 解析 Gitee 的 `/releases/latest` 302 拿到最新 tag，再拼出清单地址。
# 复用 updater 已经引进来的 reqwest 0.13，不新增第二份 HTTP 栈；
# `tauri-plugin-http` 那份是 0.12，两者共存是上游版本差异，不是本文件造成的。
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# Plugin packages: `zip` reads `.qnp` archives, `sha2` verifies index hashes.
# `zip` keeps only deflate: store + deflate is what every packer emits, and the
# other codecs would just be dead weight in the installer.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# Vault (knowledge base) module: `notify` watches a user folder from the Rust
# side so the renderer needs no `fs` scope for it. `encoding_rs` is already in
# the tree as a transitive dependency (0.8.42), so declaring it here adds no new
# crate — it is used for the GB18030 fallback when a note is not valid UTF-8.
notify = "8"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Memory"] }
# Same versions wry 0.57 resolves internally: no duplicate crates, no binary growth.
# Re-check with `cargo tree -i webview2-com` after any tauri/wry bump.
webview2-com = "0.39"
windows = { version = "0.62", default-features = false }
